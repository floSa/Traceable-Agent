[project]
name = "investigator"
version = "0.1.0"
description = "Moteur d'investigation par taches atomiques, memoire = un fichier markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    "ruamel.yaml>=0.18",
    "typer>=0.15",
    "rich>=13.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
sql = ["duckdb>=1.1"]

[project.scripts]
inv = "engine.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
