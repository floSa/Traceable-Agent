# =============================================================================
# Configuration du moteur d'investigation.
#
# REGLE : tout parametre qui change le comportement du moteur est ICI, visible.
# Les six "trous" du pattern d'origine sont annotes TROU 1..6.
# Les secrets et l'adressage machine restent dans .env (`${VAR:-defaut}`).
# =============================================================================

paths:
  investigations: ./investigations

# -----------------------------------------------------------------------------
# Couche modele — pointe sur le service LLM central
# (~/mes_projets/Projet-IA/LLM-Service), endpoint OpenAI-compatible. Aucun
# Ollama propre a ce projet.
# -----------------------------------------------------------------------------
llm:
  base_url: ${INV_LLM_BASE_URL:-http://127.0.0.1:8080/v1}
  model: ${INV_LLM_MODEL:-chat}
  api_key: ${INV_LLM_API_KEY:-}
  timeout_s: 600
  # auto : tente response_format=json_schema (supporte par le central),
  #        retombe automatiquement sur l'injection du schema dans le prompt.
  structured_output: auto
  # Retry a feedback : on renvoie au modele l'erreur de validation Pydantic.
  # C'est ce qui rend un petit modele exploitable. Ne pas descendre sous 3.
  max_validation_retries: 3
  # 0 pour la mesure : a 0.2, quatre questions sur treize changeaient de verdict
  # entre executions identiques, et la variance masquait l'effet mesure.
  temperature: 0
  # Le modele "chat" du service central inclut deja le raisonnement dans
  # usage.completion_tokens (verifie en run reel) : le re-estimer doublerait
  # le compte. A remettre a true pour un backend qui l'exclut, comme l'ancien
  # Ollama/gemma4:e4b.
  count_reasoning_tokens: false
  # Un modele a raisonnement peut terminer sa reflexion et renvoyer un
  # contenu VIDE (finish_reason=stop/length). Une derniere ligne imperative
  # dans le prompt le ramene a emettre le JSON. Sans effet sur les modeles
  # qui n'en ont pas besoin.
  final_directive: true
  # Le modele "chat" du service central reflechit par defaut (Qwen3.5).
  # Mesure en run reel : avec les budgets de tokens de ce moteur, ca epuise
  # le budget avant le JSON (3/3 tentatives vides, meme avec final_directive).
  # On coupe la reflexion par defaut. A remettre a true seulement en
  # remontant au moins brief.max_tokens, agent.max_tokens_per_call et
  # synthesis.max_tokens.
  enable_thinking: false

# -----------------------------------------------------------------------------
# TROU 1 — CONTEXTE PASSE AU SOUS-AGENT
# build_context(plan, task) est une fonction pure, testee isolement.
# Elle n'assemble QUE : la question globale, les watch_outs, et l'`insight`
# des taches listees dans depends_on. Jamais le logbook complet.
# -----------------------------------------------------------------------------
context:
  max_chars: 4000
  include_question: true
  include_watch_outs: true
  include_dependencies: true
  max_dependencies: 10

# -----------------------------------------------------------------------------
# TROU 2 — EVALUATION DU CRITERE D'ARRET
#   none     : jamais evalue (defaut POC)
#   llm      : un appel dedie minimal (critere + insights accumules)
#   callable : une fonction Python fournie, "module:fonction"
# L'evaluation est journalisee dans logbook.stop_log quelle que soit l'issue.
# -----------------------------------------------------------------------------
stop:
  strategy: none
  callable: null
  max_tokens: 2000

# -----------------------------------------------------------------------------
# TROU 4 — BUDGET D'ITERATION DU SOUS-AGENT
# Depassement -> tache marquee `blocked` avec la raison. Jamais de crash.
# -----------------------------------------------------------------------------
agent:
  # Defaut du moteur : 5 (engine/config.py). Valeur livree ici : 10, mesuree
  # necessaire avec gemma4:e4b, qui interroge volontiers un fichier par appel
  # sur les taches a perimetre multi-fichiers. Redescendre a 5 avec un modele
  # plus synthetique : c'est un cout direct en tokens.
  max_tool_calls: 10         # nb max de tours (appel d'outil OU refus) par tache
  max_tokens: 20000          # budget de la tache entiere
  max_tokens_per_call: 4096  # plafond d'un seul appel LLM

# -----------------------------------------------------------------------------
# VERIFICATION CONTRAIGNANTE DES RESULTATS
# `task.sanity_check` reste une consigne rendue au prompt ; ce sont les `checks`
# d'une tache qui DECIDENT. La distinction n'est pas theorique : ajouter au
# prompt « si tu es loin de l'ordre de grandeur documente, ta requete est
# fausse » a ete essaye sur ce meme jeu de donnees, et mesure sans effet — meme
# requete naive, aucune auto-correction. Un modele ne se verifie pas lui-meme.
#
# binding: false evalue et journalise sans rien arreter — utile pour mesurer ce
# que les controles attraperaient avant de les rendre bloquants.
# -----------------------------------------------------------------------------
checks:
  binding: true

# -----------------------------------------------------------------------------
# TROU 6 — REPRISE APRES ECHEC
# Le fichier etant la seule source de verite, `inv run` reprend a la premiere
# tache `pending`. Les `blocked` sont ignorees sauf --retry-blocked.
# Circuit breaker : N blocked consecutifs arretent la boucle.
# -----------------------------------------------------------------------------
loop:
  max_consecutive_blocked: 2
  retry_blocked: false

# -----------------------------------------------------------------------------
# TOOLPACKS — la seule chose qui varie d'un usage a l'autre.
# Le moteur ne connait aucun domaine metier.
# -----------------------------------------------------------------------------
toolpack:
  default: files

  files:
    root: ./corpus
    max_results: 50      # nb de lignes/fichiers rendus par grep/list
    max_bytes: 20000     # taille max d'un ToolResult rendu au LLM
    max_file_bytes: 200000

  sql:
    database: ./data/maxizoo.duckdb
    # Le dictionnaire de la source : le DDL dit les types, lui dit ce que les
    # donnees VEULENT DIRE (6 pieges de modelisation, ordres de grandeur).
    # Injecte dans la description du pack, donc AVANT la question — un modele
    # qui apprend au 3e tour que le e-commerce est une ligne de `stores` a deja
    # rendu son top magasins.
    dictionary: ./data/maxizoo_dictionnaire.md
    max_dictionary_chars: 12000
    default_limit: 1000  # LIMIT injecte si la requete n'en a pas
    max_rows: 5000
    read_only: true

# TROU 3 (ecriture du fichier) et TROU 5 (artefacts visuels) n'ont pas de
# reglage : le premier est une invariante du moteur (JSON -> Pydantic ->
# reecriture atomique revalidee), le second est hors perimetre du POC
# (logbook.findings[].chart existe et reste null). Voir README > Extensions.
